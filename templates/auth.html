<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Legal AI — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>

<nav>
  <div class="nav-container">
    <a href="/" class="logo">
      <span class="logo-icon">⚖️</span>
      <span>Legal AI</span>
    </a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/#features">Features</a>
      <a href="/#faq">FAQ</a>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-wrapper">

    <div class="auth-header">
      <div class="auth-badge">Indian Legal Intelligence</div>
      <h1 id="auth-title">Welcome Back</h1>
      <p id="auth-subtitle">Sign in to access your legal research assistant.</p>
    </div>

    <div class="auth-card">

      <div class="tab-toggle">
        <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Sign In -->
      <div class="form-panel active" id="panel-signin">
        <div class="error-banner" id="signin-error"></div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <input type="email" id="signin-email" placeholder="you@example.com" />
            <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l9 6 9-6" />
            </svg>
          </div>
        </div>

        <div class="form-group">
          <div class="form-row" style="margin-bottom:8px">
            <label style="margin:0">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <input type="password" id="signin-pw" class="has-toggle" placeholder="••••••••" />
            <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <button class="pw-toggle" type="button" onclick="togglePw('signin-pw', this)" tabindex="-1">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="checkbox-wrap">
            <input type="checkbox" />
            <span>Remember me for 30 days</span>
          </label>
        </div>

        <button class="submit-btn" id="signin-btn" onclick="handleSignin()">Sign In</button>
      </div>

      <!-- Sign Up -->
      <div class="form-panel" id="panel-signup">
        <div class="error-banner" id="signup-error"></div>

        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrap">
            <input type="text" id="signup-name" placeholder="Arjun Sharma" />
            <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <input type="email" id="signup-email" placeholder="you@example.com" />
            <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l9 6 9-6" />
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <input type="password" id="signup-pw" class="has-toggle" placeholder="Min. 8 characters" />
            <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <button class="pw-toggle" type="button" onclick="togglePw('signup-pw', this)" tabindex="-1">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button class="submit-btn" id="signup-btn" onclick="handleSignup()">Create Account</button>

        <p style="text-align:center; font-size:0.78rem; color:#555; margin-top:18px; line-height:1.5">
          By creating an account you agree to our
          <a href="#" style="color:#888; text-decoration:underline">Terms of Service</a> and
          <a href="#" style="color:#888; text-decoration:underline">Privacy Policy</a>.
        </p>
      </div>

      <div class="switch-prompt" id="switch-hint">
        <span>Don't have an account? </span>
        <button onclick="switchTab('signup')">Sign up free</button>
      </div>

    </div>
  </div>
</div>

<script src="/static/auth.js"></script>
</body>
</html>
