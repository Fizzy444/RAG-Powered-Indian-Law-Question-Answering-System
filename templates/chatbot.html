<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Indian Legal Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/chatbot.css">
</head>
<body>

    <div class="topbar">
        <div class="topbar-left">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 3v18"/>
                </svg>
            </button>
            <a href="/" class="topbar-logo">
                <span>⚖️</span>
                <span>Legal AI</span>
            </a>
        </div>
        <div class="topbar-right">
            <button class="new-chat-btn" id="newChatBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                New Chat
            </button>
            <button class="signout-btn" id="signoutBtn">Sign Out</button>
        </div>
    </div>

    <div class="shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Chat History</h3>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty" id="historyEmpty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <div>No conversations yet.<br>Start asking a question.</div>
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="sidebar-footer-info">Conversations are saved locally in your browser.</div>
            </div>
        </aside>

        <main class="main">
            <div class="chat-box" id="chatBox">
                <div class="message-row bot-row">
                    <div class="message-wrap">
                        <div class="bot-avatar">⚖️</div>
                        <div>
                            <div class="message bot-message">Hello! I am your Indian legal research assistant. Ask me anything about Indian law — statutes, case law, constitutional provisions, and more.</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="loading-row" id="loadingIndicator" style="display:none;">
                <div class="bot-avatar">⚖️</div>
                <div class="loading-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <div class="input-area">
                <select id="languageSelect" class="language-select">
                    <option value="en">English</option>
                    <option value="ta">Tamil</option>
                </select>
                <input type="text"
                    id="userInput"
                    placeholder="Type your legal query here..."
                    onkeypress="handleKeyPress(event)">
                <button onclick="sendQuery()" id="sendBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script src="/static/chatbot.js"></script>
</body>
</html>
